<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>ChatCQ - 火腿专属 AI</title>
    <style>
        /* 默认深色模式变量 */
        :root {
            --bg-color: #1e1e1e;
            --sidebar-bg: #252526;
            --text-color: #cccccc;
            --border-color: #3e3e42;
            --msg-user-bg: #2d2d2d;
            --msg-bot-bg: #1e1e1e;
            --accent-color: #007acc;
            --input-bg: #2d2d2d;
            --danger-color: #f44336;
            --shadow: rgba(0,0,0,0.3);
        }

        /* 白色模式变量 */
        body.theme-light {
            --bg-color: #f9f9fb;
            --sidebar-bg: #ffffff;
            --text-color: #333333;
            --border-color: #e5e5e5;
            --msg-user-bg: #f3f4f6;
            --msg-bot-bg: #ffffff;
            --accent-color: #4d6bfe;
            --input-bg: #ffffff;
            --shadow: rgba(0,0,0,0.05);
        }

        /* 黑客模式变量 */
        body.theme-hacker {
            --bg-color: #000000;
            --sidebar-bg: #0a0a0a;
            --text-color: #00ff00;
            --border-color: #005500;
            --msg-user-bg: #002200;
            --msg-bot-bg: #000000;
            --accent-color: #00ff00;
            --input-bg: #000000;
            --shadow: rgba(0,255,0,0.1);
        }

        /* 黑客模式全局字体替换 */
        body.theme-hacker * { font-family: 'Courier New', Courier, monospace !important; text-shadow: 0 0 3px #00ff00; }
        body.theme-hacker .message { border: 1px solid var(--border-color); }

        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; background-color: var(--bg-color); color: var(--text-color); display: flex; height: 100vh; margin: 0; padding: 0; overflow: hidden; transition: background-color 0.3s, color 0.3s; }
        
        /* 侧边栏 */
        .sidebar { width: 260px; background: var(--sidebar-bg); border-right: 1px solid var(--border-color); display: flex; flex-direction: column; }
        .sidebar-header { padding: 20px 15px; }
        .logo-text { font-size: 20px; font-weight: bold; color: var(--accent-color); margin-bottom: 15px; display: flex; align-items: center; gap: 8px;}
        .new-chat-btn { width: 100%; padding: 12px; background: var(--accent-color); color: #fff; border: none; border-radius: 12px; font-weight: 500; font-size: 14px; cursor: pointer; transition: 0.2s; display: flex; justify-content: center; align-items: center; gap: 5px;}
        .new-chat-btn:hover { opacity: 0.8; }
        .import-btn { width: 100%; padding: 10px; background: transparent; color: var(--text-color); border: 1px solid var(--border-color); border-radius: 12px; font-size: 13px; cursor: pointer; margin-top: 10px; transition: 0.2s;}
        .import-btn:hover { background: var(--msg-user-bg); }
        
        .history-list { flex: 1; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 5px; }
        
        .history-item { display: flex; justify-content: space-between; align-items: center; padding: 12px; border-radius: 8px; cursor: pointer; font-size: 14px; color: var(--text-color); transition: 0.2s; border: 1px solid transparent;}
        .history-item:hover { background: var(--msg-user-bg); }
        .history-item.active { background: var(--msg-user-bg); color: var(--accent-color); font-weight: bold; border-color: var(--border-color);}
        
        .history-title { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; pointer-events: none;}
        .delete-btn { display: none; font-size: 16px; cursor: pointer; padding: 2px 5px; border-radius: 4px; transition: 0.2s; }
        .history-item:hover .delete-btn { display: block; }
        .delete-btn:hover { background: var(--danger-color); color: #fff; }

        /* 主聊天区 */
        .main-content { flex: 1; display: flex; flex-direction: column; background-color: var(--bg-color); position: relative; }
        
        /* 顶部设置 */
        .header { padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; background: var(--bg-color); border-bottom: 1px solid var(--border-color); flex-wrap: wrap; gap: 10px;}
        .settings-group { display: flex; gap: 10px; align-items: center; flex-wrap: wrap;}
        .header select, .header input { padding: 8px 12px; border-radius: 8px; border: 1px solid var(--border-color); background: var(--input-bg); color: var(--text-color); outline: none; font-size: 13px; }
        .header input[type="password"] { width: 180px; }
        .header input[type="text"] { width: 180px; }
        .save-btn { padding: 8px 15px; background: var(--accent-color); color: #fff; border: none; border-radius: 8px; cursor: pointer; font-size: 13px;}
        
        /* 主题切换按钮 */
        .theme-btn { padding: 8px 15px; background: transparent; color: var(--text-color); border: 1px solid var(--border-color); border-radius: 8px; cursor: pointer; font-size: 13px; transition: 0.2s;}
        .theme-btn:hover { background: var(--msg-user-bg); }

        /* 聊天内容区 */
        .chat-box { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 25px; scroll-behavior: smooth;}
        .message-row { display: flex; width: 100%; }
        .message-row.user { justify-content: flex-end; }
        .message-row.bot { justify-content: flex-start; }
        
        .message { max-width: 75%; padding: 14px 18px; border-radius: 16px; line-height: 1.6; font-size: 15px; word-wrap: break-word; white-space: pre-wrap; }
        .message strong { color: var(--accent-color); font-weight: bold;}
        .message br { margin-bottom: 5px; }

        .user .message { background: var(--msg-user-bg); border-bottom-right-radius: 4px; color: var(--text-color); border: 1px solid var(--border-color); }
        .bot .message { background: var(--msg-bot-bg); border-bottom-left-radius: 4px; box-shadow: 0 2px 8px var(--shadow); border: 1px solid var(--border-color); color: var(--text-color);}

        /* 光标闪烁动效 */
        .cursor { display: inline-block; width: 6px; height: 16px; background: var(--accent-color); vertical-align: middle; margin-left: 4px; animation: blink 1s step-end infinite; }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

        /* 底部输入区 */
        .input-area { padding: 20px; display: flex; justify-content: center; }
        .input-container { width: 100%; max-width: 800px; display: flex; align-items: flex-end; background: var(--input-bg); border: 1px solid var(--border-color); border-radius: 16px; padding: 10px 15px; box-shadow: 0 4px 20px var(--shadow); transition: 0.3s; }
        .input-container:focus-within { border-color: var(--accent-color); }
        
        .input-container input[type="text"] { flex: 1; border: none; background: transparent; color: var(--text-color); outline: none; font-size: 15px; padding: 10px 5px; }
        .btn-group { display: flex; gap: 8px; align-items: center; margin-bottom: 5px;}
        .icon-btn { background: transparent; border: none; font-size: 18px; cursor: pointer; padding: 8px; border-radius: 8px; transition: 0.2s; color: var(--text-color);}
        .icon-btn:hover { background: var(--msg-user-bg); }
        
        .send-btn { background: var(--accent-color); color: #fff; border: none; border-radius: 10px; width: 36px; height: 36px; display: flex; justify-content: center; align-items: center; cursor: pointer; transition: 0.2s; }
        .send-btn:hover { opacity: 0.8; }
        .send-btn:disabled { background: #555; cursor: not-allowed; }
        
        .img-preview { max-width: 100px; max-height: 100px; border-radius: 8px; margin-right: 10px; display: none; border: 1px solid var(--border-color);}
        #imageInput, #importFile { display: none; }

        /* 作者信息面板 */
        .author-info { font-size: 12px; color: var(--text-color); opacity: 0.7; text-align: center; padding: 10px; border-top: 1px solid var(--border-color); margin-top: auto;}
        .author-info a { color: var(--accent-color); text-decoration: none; }
        .author-info a:hover { text-decoration: underline; }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 10px; }
    </style>
</head>
<body class="theme-dark">

<!-- 侧边栏 -->
<div class="sidebar">
    <div class="sidebar-header">
        <div class="logo-text">📻 ChatCQ</div>
        <button class="new-chat-btn" onclick="createNewChat()">
            <span>+</span> 新建对话
        </button>
        <button class="import-btn" onclick="document.getElementById('importFile').click()">📂 导入 JSON 记录</button>
        <input type="file" id="importFile" accept=".json" onchange="importChat(this)">
    </div>
    <div class="history-list" id="historyList"></div>
    
    <!-- 底部联系方式 -->
    <div class="author-info">
        <div>👨‍💻 开发者: SeekDeepHam</div>
        <div>📧 xuyihuan0105@163.com</div>
        <div>💬 微信: xyc657260</div>
    </div>
</div>

<!-- 主界面 -->
<div class="main-content">
    <div class="header">
        <div class="settings-group">
            <select id="apiProvider" onchange="onProviderChange()">
                <option value="https://api.deepseek.com/chat/completions|deepseek-chat">DeepSeek</option>
                <option value="https://api.moonshot.cn/v1/chat/completions|moonshot-v1-8k-vision-preview">Kimi (支持看图)</option>
                <option value="custom">自定义 API</option>
            </select>
            <input type="password" id="apiKeyInput" placeholder="填入 API Key" onchange="saveSettings()">
            <button class="save-btn" onclick="exportChat()">导出对话</button>
        </div>
        
        <div style="display: flex; gap: 10px; align-items: center;">
            <div id="customConfig" style="display:none; gap: 5px;">
                <input type="text" id="customUrl" placeholder="API URL" onchange="saveSettings()">
                <input type="text" id="customModel" placeholder="模型名" onchange="saveSettings()">
            </div>
            <!-- 主题切换按钮 -->
            <button class="theme-btn" id="themeBtn" onclick="toggleTheme()">🌙 深色模式</button>
        </div>
    </div>
    
    <div class="chat-box" id="chatBox"></div>
    
    <div class="input-area">
        <div class="input-container">
            <img id="imgPreview" class="img-preview">
            <input type="text" id="userInput" placeholder="向 ChatCQ 发送消息..." onkeypress="if(event.key==='Enter') sendMessage()">
            <div class="btn-group">
                <input type="file" id="imageInput" accept="image/*" onchange="previewImage(this)">
                <button class="icon-btn" onclick="document.getElementById('imageInput').click()">📎</button>
                <button id="sendBtn" class="send-btn" onclick="sendMessage()">↑</button>
            </div>
        </div>
    </div>
</div>

<script>
    let API_URL = "";
    let MODEL_NAME = "";
    let base64Image = null;
    let chatHistory = []; 
    
    let allChats = JSON.parse(localStorage.getItem('chatcq_all_chats')) || {};
    let currentChatId = localStorage.getItem('chatcq_current_id') || null;

    // 核心提示词
    const SYSTEM_PROMPT = "你现在扮演的角色名叫 'ChatCQ'，是一个由火腿 SeekDeepHam 独立开发的、专为业余无线电爱好者（HAM）打造的硬核 AI 助手。请记住：1. 你的名字叫 ChatCQ，绝对不要自称 DeepSeek 或其他名字；2. 如果用户问你是什么模型，回答：我是由 SeekDeepHam 开发的 ChatCQ；3. 语气要专业、幽默、接地气，多用火腿黑话。";

    window.onload = function() {
        const savedKey = localStorage.getItem('chatcq_api_key');
        const savedProvider = localStorage.getItem('chatcq_provider');
        if (savedKey) document.getElementById('apiKeyInput').value = savedKey;
        if (savedProvider) document.getElementById('apiProvider').value = savedProvider;
        
        onProviderChange();
        initTheme(); // 加载保存的主题

        if (Object.keys(allChats).length === 0 || !currentChatId || !allChats[currentChatId]) {
            createNewChat("主对话 (Main)");
        } else {
            renderHistoryList();
            loadChat(currentChatId);
        }
    };

    // ================= 主题切换逻辑 =================
    const themes = ['theme-dark', 'theme-light', 'theme-hacker'];
    const themeNames = { 'theme-dark': '🌙 深色模式', 'theme-light': '☀️ 白色模式', 'theme-hacker': '💻 黑客模式' };
    
    function initTheme() {
        const savedTheme = localStorage.getItem('chatcq_theme') || 'theme-dark';
        document.body.className = savedTheme;
        document.getElementById('themeBtn').innerText = themeNames[savedTheme];
    }

    function toggleTheme() {
        let currentTheme = document.body.className;
        let nextIndex = (themes.indexOf(currentTheme) + 1) % themes.length;
        let nextTheme = themes[nextIndex];
        
        document.body.className = nextTheme;
        document.getElementById('themeBtn').innerText = themeNames[nextTheme];
        localStorage.setItem('chatcq_theme', nextTheme);
    }

    // ================= 其他逻辑 =================
    function onProviderChange() {
        const provider = document.getElementById('apiProvider').value;
        const customConfig = document.getElementById('customConfig');
        
        if (provider === 'custom') {
            customConfig.style.display = 'flex';
            API_URL = document.getElementById('customUrl').value;
            MODEL_NAME = document.getElementById('customModel').value;
        } else {
            customConfig.style.display = 'none';
            const val = provider.split("|");
            API_URL = val[0];
            MODEL_NAME = val[1];
        }
        saveSettings();
    }

    function saveSettings() {
        localStorage.setItem('chatcq_api_key', document.getElementById('apiKeyInput').value.trim());
        localStorage.setItem('chatcq_provider', document.getElementById('apiProvider').value);
        localStorage.setItem('chatcq_custom_url', document.getElementById('customUrl').value);
        localStorage.setItem('chatcq_custom_model', document.getElementById('customModel').value);
    }

    function renderHistoryList() {
        const list = document.getElementById('historyList');
        list.innerHTML = '';
        Object.keys(allChats).forEach(id => {
            const div = document.createElement('div');
            div.className = `history-item ${id === currentChatId ? 'active' : ''}`;
            
            const titleSpan = document.createElement('span');
            titleSpan.className = 'history-title';
            titleSpan.innerText = allChats[id].name;
            
            const delBtn = document.createElement('span');
            delBtn.className = 'delete-btn';
            delBtn.innerText = '🗑️';
            delBtn.onclick = (e) => {
                e.stopPropagation();
                deleteChat(id);
            };

            div.appendChild(titleSpan);
            div.appendChild(delBtn);
            div.onclick = () => loadChat(id);
            list.appendChild(div);
        });
    }

    function deleteChat(chatId) {
        if (!confirm(`确定要永久删除对话【${allChats[chatId].name}】吗？`)) return;
        delete allChats[chatId];
        saveAllData();

        if (chatId === currentChatId) {
            const remainingIds = Object.keys(allChats);
            if (remainingIds.length > 0) {
                loadChat(remainingIds[0]);
            } else {
                createNewChat("主对话 (Main)");
            }
        } else {
            renderHistoryList();
        }
    }

    function createNewChat(forceName = null) {
        const chatId = "chat_" + Date.now();
        const chatName = forceName || prompt("给这个新对话起个名字：", "新对话 " + (Object.keys(allChats).length + 1));
        if (!chatName) return;

        allChats[chatId] = { name: chatName, messages: [] };
        currentChatId = chatId;
        saveAllData();
        renderHistoryList();
        
        document.getElementById('chatBox').innerHTML = '';
        chatHistory = [];
        appendMessageHTML("你好！我是 ChatCQ，由 SeekDeepHam 开发的专属火腿 AI。今天想聊点什么？", 'bot');
    }

    function loadChat(chatId) {
        currentChatId = chatId;
        localStorage.setItem('chatcq_current_id', chatId);
        
        const chatBox = document.getElementById('chatBox');
        chatBox.innerHTML = '';
        
        const chatData = allChats[chatId];
        if (!chatData) return;

        chatHistory = []; 
        
        if (chatData.messages.length === 0) {
            appendMessageHTML("你好！我是 ChatCQ，由 SeekDeepHam 开发的专属火腿 AI。今天想聊点什么？", 'bot');
        } else {
            chatData.messages.forEach(msg => {
                let text = typeof msg.content === 'string' ? msg.content : (msg.content.map ? msg.content.map(c => c.text || "").join(" ") : "");
                appendMessageHTML(text, msg.role === 'user' ? 'user' : 'bot');
                chatHistory.push(msg);
            });
        }
        renderHistoryList();
        scrollToBottom();
    }

    function saveAllData() {
        localStorage.setItem('chatcq_all_chats', JSON.stringify(allChats));
    }

    function exportChat() {
        if (!currentChatId) return;
        const chatData = allChats[currentChatId];
        
        const exportData = {
            platform: "ChatCQ",
            version: "1.1",
            chatName: chatData.name,
            exportTime: new Date().toISOString(),
            history: chatData.messages
        };

        const blob = new Blob([JSON.stringify(exportData, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url; 
        a.download = `ChatCQ_${chatData.name}.json`; 
        a.click();
        URL.revokeObjectURL(url);
    }

    function importChat(input) {
        const file = input.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function(e) {
            try {
                const data = JSON.parse(e.target.result);
                if (!data.history || !Array.isArray(data.history)) throw new Error("格式不正确");

                const chatId = "chat_" + Date.now();
                allChats[chatId] = { name: data.chatName || "导入的对话", messages: data.history };
                currentChatId = chatId;
                
                saveAllData(); 
                renderHistoryList(); 
                loadChat(chatId);
                alert("✅ ChatCQ 对话导入成功！");
            } catch (err) {
                alert("❌ 导入失败：请确保这是 ChatCQ 导出的 .json 格式文件！");
            }
            input.value = ''; 
        };
        reader.readAsText(file);
    }

    function previewImage(input) {
        if (input.files && input.files[0]) {
            var reader = new FileReader();
            reader.onload = function (e) {
                document.getElementById('imgPreview').src = e.target.result;
                document.getElementById('imgPreview').style.display = 'block';
                base64Image = e.target.result.split(',')[1];
            };
            reader.readAsDataURL(input.files[0]);
        }
    }

    function parseMarkdown(text) {
        let html = text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        html = html.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>'); 
        html = html.replace(/\n/g, '<br>'); 
        return html;
    }

    async function sendMessage() {
        const input = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');
        const apiKey = document.getElementById('apiKeyInput').value.trim();
        const text = input.value.trim();
        
        if (!text && !base64Image) return;
        if (!apiKey) return alert("请先在右上角填入 API Key！");

        let userMsg = text;
        if (base64Image) userMsg = (text ? text + "\n" : "") + "[已上传图片]";
        
        appendMessageHTML(parseMarkdown(userMsg), 'user');
        input.value = '';
        document.getElementById('imgPreview').style.display = 'none';

        let content = [];
        if (text) content.push({ type: "text", text: text });
        if (base64Image) content.push({ type: "image_url", image_url: { url: `data:image/jpeg;base64,${base64Image}` } });

        let currentMsg = { role: "user", content: content.length === 1 && text ? text : content };
        chatHistory.push(currentMsg);
        allChats[currentChatId].messages.push(currentMsg);
        saveAllData();

        sendBtn.disabled = true;
        
        const botMsgDiv = appendMessageHTML('<span class="typing-text"></span><span class="cursor"></span>', 'bot');
        const textSpan = botMsgDiv.querySelector('.typing-text');
        const cursorSpan = botMsgDiv.querySelector('.cursor');

        try {
            await new Promise(r => setTimeout(r, 300)); // 缓冲一下防高频报错

            const messagesPayload = [
                { role: "system", content: SYSTEM_PROMPT },
                ...chatHistory
            ];

            const response = await fetch(API_URL, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${apiKey}`
                },
                body: JSON.stringify({
                    model: MODEL_NAME,
                    messages: messagesPayload,
                    stream: true 
                })
            });

            if (!response.ok) throw new Error(`HTTP: ${response.status}`);

            const reader = response.body.getReader();
            const decoder = new TextDecoder("utf-8");
            let fullReply = "";

            while (true) {
                const { done, value } = await reader.read();
                if (done) break;
                
                const chunk = decoder.decode(value, { stream: true });
                const lines = chunk.split('\n');
                
                for (const line of lines) {
                    if (line.startsWith('data: ') && line !== 'data: [DONE]') {
                        try {
                            const data = JSON.parse(line.slice(6));
                            const chunkContent = data.choices[0].delta.content || "";
                            fullReply += chunkContent;
                            textSpan.innerHTML = parseMarkdown(fullReply); 
                            scrollToBottom();
                        } catch (e) {}
                    }
                }
            }
            
            cursorSpan.remove(); 
            chatHistory.push({ role: "assistant", content: fullReply });
            allChats[currentChatId].messages.push({ role: "assistant", content: fullReply });
            saveAllData();

        } catch (error) {
            cursorSpan.remove();
            textSpan.innerHTML = `<span style="color:red;">请求失败！原因：网络拦截或 Key 错误。</span>`;
        } finally {
            sendBtn.disabled = false;
            base64Image = null; 
        }
    }

    function appendMessageHTML(text, sender) {
        const chatBox = document.getElementById('chatBox');
        const rowDiv = document.createElement('div');
        rowDiv.className = `message-row ${sender}`;
        
        const msgDiv = document.createElement('div');
        msgDiv.className = 'message';
        msgDiv.innerHTML = text;
        
        rowDiv.appendChild(msgDiv);
        chatBox.appendChild(rowDiv);
        scrollToBottom();
        return msgDiv;
    }

    function scrollToBottom() {
        const chatBox = document.getElementById('chatBox');
        chatBox.scrollTop = chatBox.scrollHeight;
    }
</script>
</body>
</html>
    }
</script>
</body>
</html>
